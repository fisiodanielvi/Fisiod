<style>
/* Layout: app de una columna con barra de pestañas abajo; pasteles rosados con acentos lila (Gastro Quirúrgica), menta, durazno y cielo */
:root{
  --bg:#fff6f9; --surface:#ffffff; --ink:#3b2433; --muted:#8a6b7d; --line:#f4dce6;
  --accent:#d6457f; --accent-ink:#ffffff; --accent-soft:#ffe3ee;
  --gastro:#7657d4; --gastro-soft:#ede7ff;
  --mint:#dcf5e8; --mint-ink:#23744f; --peach:#ffe7d6; --peach-ink:#a9531f; --sky:#e1eeff; --sky-ink:#33609f;
  --ok:#23744f; --warn:#b5730f; --bad:#c3304b;
  --shadow:0 8px 24px rgba(214,69,127,.10);
  --display:"Fredoka",ui-rounded,ui-sans-serif,system-ui,sans-serif;
  --body:"Nunito",ui-sans-serif,system-ui,sans-serif;
  --r:20px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1d1219; --surface:#2a1b25; --ink:#f9eaf2; --muted:#c7a5b8; --line:#40293a;
  --accent:#ff8cba; --accent-ink:#2b0f1d; --accent-soft:#4a2339;
  --gastro:#bba5ff; --gastro-soft:#30264a;
  --mint:#1e3a2e; --mint-ink:#93e3bb; --peach:#47291b; --peach-ink:#ffb98c; --sky:#1f2c43; --sky-ink:#a3c6ff;
  --ok:#86dcae; --warn:#f2c262; --bad:#ff8fa1; --shadow:0 8px 24px rgba(0,0,0,.28); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1d1219; --surface:#2a1b25; --ink:#f9eaf2; --muted:#c7a5b8; --line:#40293a;
  --accent:#ff8cba; --accent-ink:#2b0f1d; --accent-soft:#4a2339;
  --gastro:#bba5ff; --gastro-soft:#30264a;
  --mint:#1e3a2e; --mint-ink:#93e3bb; --peach:#47291b; --peach-ink:#ffb98c; --sky:#1f2c43; --sky-ink:#a3c6ff;
  --ok:#86dcae; --warn:#f2c262; --bad:#ff8fa1; --shadow:0 8px 24px rgba(0,0,0,.28); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;margin:0}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 112px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;font-weight:600}
h1{font-size:1.75rem;line-height:1.1} h2{font-size:1.2rem} h3{font-size:1.02rem}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:800}
.muted{color:var(--muted)} .small{font-size:.86rem}
.stack{display:flex;flex-direction:column;gap:14px} .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.logo{font-family:var(--display);font-weight:700;letter-spacing:.12em;font-size:1rem;color:var(--accent);display:flex;align-items:center;gap:8px}
.logo i{width:26px;height:26px;border-radius:9px;background:var(--accent);display:inline-grid;place-items:center;color:var(--accent-ink);font-style:normal;font-size:.9rem;letter-spacing:0}
.who{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.who button{border:0;background:transparent;min-height:32px;padding:4px 10px;font-size:.82rem}
.who button.on{background:var(--accent-soft);color:var(--accent)}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.item{display:flex;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);min-width:0}
.item:first-child{border-top:0}
.item .grow{flex:1;min-width:0}
.item .name{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tap{cursor:pointer;transition:background .15s}
.tap:hover{background:var(--accent-soft)}
.clock{font-family:var(--display);font-weight:600;font-variant-numeric:tabular-nums;min-width:56px;line-height:1.15}
button,.btn{font:inherit;font-weight:800;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 15px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;min-height:40px;transition:transform .12s, background .15s}
button.primary,.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:0 6px 16px rgba(214,69,127,.25)}
button.lila{background:var(--gastro);color:#fff;border-color:var(--gastro)}
button.ghost{border-color:transparent;background:transparent;padding:8px 10px;box-shadow:none}
button.danger{color:var(--bad)}
button:disabled{opacity:.5;cursor:default}
@media (prefers-reduced-motion:no-preference){button:active,.btn:active{transform:scale(.96)}}
button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wa{background:#25a35a;color:#fff;border-color:#25a35a}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;font-weight:800;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.gastro{background:var(--gastro-soft);color:var(--gastro)}
.pill.mint{background:var(--mint);color:var(--mint-ink)}
.pill.peach{background:var(--peach);color:var(--peach-ink)}
.pill.sky{background:var(--sky);color:var(--sky-ink)}
.pill.done{background:transparent;border:1px solid var(--line);color:var(--muted)}
.pill.bad{background:transparent;border:1px solid var(--bad);color:var(--bad)}
.av{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-family:var(--display);font-weight:600;flex:none;background:var(--accent-soft);color:var(--accent)}
.av.gastro{background:var(--gastro-soft);color:var(--gastro)}
.av.daniel{background:var(--sky);color:var(--sky-ink)}
.av.sm{width:30px;height:30px;border-radius:10px;font-size:.8rem}
label{display:block;font-weight:800;font-size:.9rem;margin-bottom:5px}
input,select,textarea{font:inherit;width:100%;padding:11px 13px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
textarea{min-height:80px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px;box-shadow:var(--shadow)}
.seg button{flex:1;border:0;background:transparent;min-height:38px;justify-content:center}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.seg button.on.g{background:var(--gastro);color:#fff}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days button{min-width:44px;justify-content:center;padding:6px 8px}
.days button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.eva{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
.eva button{padding:0;justify-content:center;border-radius:10px;min-height:42px;font-variant-numeric:tabular-nums}
.eva button.on{color:#fff;border-color:transparent}
.eva-legend{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted);margin-top:3px}
.scale5{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.scale5 button{justify-content:center;border-radius:10px;padding:0}
.scale5 button.on,.opts button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opts{display:flex;gap:6px;flex-wrap:wrap}
/* Hero */
.hero{border-radius:26px;padding:20px 18px;position:relative;overflow:hidden;background:
  radial-gradient(circle at 92% 8%, var(--gastro-soft) 0 64px, transparent 65px),
  radial-gradient(circle at 78% 120%, var(--peach) 0 80px, transparent 81px),
  radial-gradient(circle at 4% 0%, var(--surface) 0 40px, transparent 41px), var(--accent-soft)}
.hero h1{max-width:80%}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:560px){.tiles{grid-template-columns:1fr 1fr}}
.tile{border-radius:18px;padding:12px 14px;min-width:0}
.tile b{display:block;font-family:var(--display);font-weight:600;font-size:1.45rem;font-variant-numeric:tabular-nums;line-height:1.2;overflow-wrap:anywhere}
.tile span{font-size:.8rem;font-weight:700}
.t1{background:var(--accent-soft);color:var(--accent)} .t2{background:var(--gastro-soft);color:var(--gastro)} .t3{background:var(--mint);color:var(--mint-ink)} .t4{background:var(--peach);color:var(--peach-ink)}
/* Pre / Post */
.steps{display:flex;align-items:center;gap:0;margin-top:8px}
.step{display:flex;flex-direction:column;align-items:center;gap:2px;flex:1;min-width:0;text-align:center}
.step .dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.8rem;border:2px dashed var(--line);color:var(--muted);background:var(--surface)}
.step.done .dot{background:var(--mint);border:2px solid var(--mint-ink);color:var(--mint-ink)}
.step.sched .dot{border:2px solid var(--gastro);color:var(--gastro)}
.step small{font-size:.72rem;color:var(--muted);line-height:1.2}
.bar{flex:1;height:3px;background:var(--line);border-radius:3px;margin-bottom:22px}
.bar.on{background:var(--mint-ink)}
.toggle{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:.85rem;cursor:pointer;border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:var(--surface);min-height:36px}
.toggle.on{background:var(--mint);color:var(--mint-ink);border-color:transparent}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
nav.tabs .in{display:flex;max-width:760px;width:100%;padding:6px 6px}
nav.tabs button{flex:1;border:0;border-radius:16px;background:transparent;flex-direction:column;gap:2px;font-size:.72rem;padding:6px 2px;min-height:54px;color:var(--muted);box-shadow:none}
nav.tabs button.on{color:var(--accent);background:var(--accent-soft)}
nav.tabs svg{width:22px;height:22px}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:20;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-head{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:2;padding-top:env(safe-area-inset-top,0px)}
.sheet-head .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.sheet-head h2{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{text-align:center;font-size:.72rem;color:var(--muted);font-weight:800}
.cal button{flex-direction:column;justify-content:flex-start;align-items:stretch;padding:4px 2px;border-radius:12px;min-height:78px;gap:2px;font-variant-numeric:tabular-nums;box-shadow:none;min-width:0;overflow:hidden;font-size:.85rem}
.cal button .dn{text-align:center}
.ev{display:block;font-size:.6rem;line-height:1.3;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:5px;padding:1px 3px;background:var(--accent-soft);color:var(--accent);text-align:left}
.ev.g{background:var(--gastro-soft);color:var(--gastro)}
.ev.h{opacity:.55;text-decoration:line-through}
.ev.more{background:transparent;color:inherit;text-align:center}
.cal button.sel .ev{background:rgba(255,255,255,.85);color:#3b2433}
@media (min-width:600px){.ev{font-size:.7rem}.cal button{min-height:92px}}
.qrbox{background:#fff;border-radius:20px;padding:16px;display:grid;place-items:center;width:max-content;max-width:100%;margin:0 auto;box-shadow:var(--shadow)}
.qrbox img,.qrbox canvas{display:block;max-width:100%;height:auto}
.cal button.other{opacity:.35}
.cal button.today{border:2px solid var(--accent)}
.cal button.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.dots i.g{background:var(--gastro)}
.cal button.sel .dots i{background:var(--accent-ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:16px;z-index:50;max-width:calc(100% - 32px);font-weight:800}
.qrow{border-top:1px dashed var(--line);padding-top:12px}
.qrow:first-child{border-top:0;padding-top:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:.85rem;padding:6px 11px;border-radius:999px;border:1.5px dashed var(--accent);color:var(--accent);background:transparent;min-height:34px;box-shadow:none}
.notice{border:1.5px solid var(--warn);border-radius:var(--r);padding:12px;background:var(--surface)}
.empty{padding:24px 14px;text-align:center;color:var(--muted)}
details summary{cursor:pointer;font-weight:800}
.doc{background:#fff;color:#3b2433;border-radius:16px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line)}
.ring{flex:none}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .2s ease-out}@keyframes up{from{transform:translateY(14px);opacity:.6}to{transform:none;opacity:1}}}
</style>

     <div class="row">${p.whatsapp?`<a class="btn wa" href="${waLink(p.whatsapp,`Hola ${p.nombre.split(' ')[0]}, soy ${pro('diana').nombre.split(' ')[0]}, fisioterapeuta. Recibí tus datos para la valoración. ¿Cuándo te queda bien?`)}" target="_blank" rel="noopener">Escribir</a>`:''}<button data-act="prosPaciente" data-id="${p.id}">Volver paciente</button><button class="ghost danger" data-act="borrarPros" data-id="${p.id}" aria-label="Eliminar prospecto">✕</button></div></div>`).join('')

function drawQR(){const el=$('#qr');const url=cfg().formUrl;if(!el||!url||typeof QRCode==='undefined')return;el.innerHTML='';new QRCode(el,{text:url,width:220,height:220,colorDark:'#3b2433',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M})}
function parsePros(t){const g=k=>{const m=t.match(new RegExp(k+'\\s*:\\s*(.+)','i'));return m?m[1].trim():''};
  const pri=g('Inter[eé]s').toLowerCase();
  return {nombre:g('Nombre'),whatsapp:g('WhatsApp'),motivo:g('Motivo'),prioridad:pri.includes('muy')?'alta':pri.includes('solo')||pri.includes('pregunta')?'baja':pri?'media':'',detalle:t.trim()}}
document.addEventListener('input',e=>{if(e.target.id!=='prPegar')return;const r=parsePros(e.target.value);if(r.nombre)$('#prNom').value=r.nombre;if(r.whatsapp)$('#prWa').value=r.whatsapp;if(r.motivo)$('#prMot').value=r.motivo;if(r.prioridad)$('#prPri').value=r.prioridad});

function vHoy(){
  const c=cfg(), t=today(), m=addDays(t,1);

  const mes=t.slice(0,7);
  const ingPart=list(S.sesiones).filter(s=>(s.fecha||'').startsWith(mes)&&S.pacientes[s.pacienteId]?.tipo!=='gastro'&&visible(S.pacientes[s.pacienteId]||{})).reduce((a,s)=>a+(Number(s.costo)||0),0);

  const nombre=', '+pro('diana').nombre.split(' ')[0];
  return `<div class="stack">
   <div class="hero"><div class="eyebrow">${esc(fmtFecha(t))}</div><h1>Hola${esc(nombre)}. Tienes ${hoy.filter(x=>x.estado==='pendiente').length||'0'} ${hoy.filter(x=>x.estado==='pendiente').length===1?'paciente':'pacientes'} hoy</h1>
    <div class="row" style="margin-top:12px"><button class="primary" data-act="nuevo" data-t="particular">+ Particular</button><button class="lila" data-act="nuevo" data-t="gastro">+ Gastro Quirúrgica</button></div></div>
   <div class="tiles">
    <div class="tile t1"><b>${activos.length}</b><span>pacientes activos</span></div>
    <div class="tile t3"><b>${money(ingPart)}</b><span>particulares este mes</span></div>
    <div class="tile t2"><b>${porPost.length}</b><span>Gastro esperando post</span></div>
    <div class="tile t4"><b>${money(gPorCobrar*(c.costoGastro||55000))}</b><span>Gastro por cobrar</span></div></div>
   ${pendExcel.length?`<div class="notice"><b>${pendExcel.length} Excel sin enviar al correo.</b> <div class="row" style="margin-top:8px">${pendExcel.slice(0,5).map(s=>`<button data-act="reenviar" data-id="${s.id}">${esc(S.pacientes[s.pacienteId]?.nombre||'Paciente')} · ${fmtCorto(s.fecha)}</button>`).join('')}</div></div>`:''}
   <h2>Citas de hoy</h2>
   <div class="list">${hoy.length?hoy.map(citaItem).join(''):`<div class="empty">No hay citas hoy. Al registrar un paciente, sus citas aparecen aquí.</div>`}</div>
   <div class="row between"><h2>Mañana · ${esc(fmtFecha(m))}</h2>
    ${c.telefono?`<a class="btn wa" href="${waLink(c.telefono,msgMio(m))}" target="_blank" rel="noopener">Enviarme la agenda</a>`:`<button data-tab="ajustes">Agrega tu WhatsApp</button>`}</div>
   <div class="list">${man.length?man.map(citaItem).join(''):`<div class="empty">Sin citas mañana.</div>`}</div>
   ${porPost.length?`<h2>Gastro Quirúrgica: post por agendar</h2><div class="list">${porPost.map(p=>`<div class="item">${avatar(p)}<div class="grow"><div class="name tap" data-act="ficha" data-id="${p.id}">${esc(p.nombre)}</div><div class="small muted">Pre hecho el ${fmtCorto(estadoGastro(p).pre?.fecha)}</div></div><button class="lila" data-act="agendarPost" data-id="${p.id}">Agendar post</button></div>`).join('')}</div>`:''}
   ${sinVal.length?`<h2>Valoraciones pendientes</h2><div class="list">${sinVal.map(p=>`<div class="item">${avatar(p)}<div class="grow"><div class="name">${esc(p.nombre)}</div><div class="small muted">${esc(p.patologia||'')}</div></div><button data-act="valoracion" data-id="${p.id}">Valorar</button></div>`).join('')}</div>`:''}
  </div>`;

function ring(h,t,color){const r=15,C=2*Math.PI*r,f=t?Math.min(1,h/t):0;
  return `<svg class="ring" width="40" height="40" viewBox="0 0 40 40" aria-label="${h} de ${t} sesiones"><circle cx="20" cy="20" r="${r}" fill="none" stroke="var(--line)" stroke-width="5"/><circle cx="20" cy="20" r="${r}" fill="none" stroke="${color}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${(C*f).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 20 20)"/><text x="20" y="24" text-anchor="middle" font-size="11" font-weight="800" fill="var(--ink)" font-family="Nunito,sans-serif">${h}</text></svg>`}
function pasos(p){const e=estadoGastro(p);
  const st=(c,lab)=>{const cls=c?.estado==='hecha'?'done':c?'sched':'';return `<div class="step ${cls}"><div class="dot">${c?.estado==='hecha'?'✓':lab[0]}</div><small><b>${lab}</b><br>${c?fmtCorto(c.fecha).slice(0,-5)+(c.modalidad?' · '+MOD[c.modalidad]:''):'Por agendar'}</small></div>`};
  return `<div class="steps">${st(e.pre,'Pre')}<div class="bar ${e.pre?.estado==='hecha'?'on':''}"></div>${st(e.post,'Post')}</div>`}

}

function vAgenda(){

   <div class="row between small" style="margin-top:10px"><div class="row"><span class="pill">Particular</span><span class="pill gastro">Gastro Quirúrgica</span></div><span class="muted">${mesCitas.length} citas · ${money(mesCitas.reduce((a,x)=>a+valorCita(x),0))} en el mes</span></div></div>
   <div class="row between"><div><h2>${esc(fmtFecha(S.calSel))}</h2>${sel.length?`<div class="small muted">${sel.length} ${sel.length===1?'cita':'citas'} · ${money(totalDia)}</div>`:''}</div>${c.telefono&&sel.length?`<a class="btn wa" href="${waLink(c.telefono,msgMio(S.calSel))}" target="_blank" rel="noopener">Enviarme este día</a>`:''}</div>

function openSheet(title,html){
  $('#sheetRoot').innerHTML=`<div class="sheet" role="dialog" aria-label="${esc(title)}"><div class="sheet-head"><div class="in"><button class="ghost" data-act="cerrar" aria-label="Cerrar">← Volver</button><h2>${esc(title)}</h2></div></div><div class="wrap" style="padding-bottom:40px">${html}</div></div>`;
  $('#sheetRoot .sheet').scrollTop=0;
}
function closeSheet(){$('#sheetRoot').innerHTML='';render()}

function planCitas(ini,dias,n){const out=[];let f=ini,g=0;while(out.length<n&&g<500){if(dias.includes(parse(f).getDay()))out.push(f);f=addDays(f,1);g++}return out}

// ===================== Medidas de seguimiento =====================
let W={medidas:[],sug:[]};
const num=x=>x===''||x==null||isNaN(+x)?null:+x;
const r1=v=>Math.round(v*10)/10;
const medCat=()=>list(S.medidas).sort((a,b)=>(b.usos||0)-(a.usos||0)||(a.nombre||'').localeCompare(b.nombre||''));
const rangoTxt=m=>m.tipo==='eva'?'Escala 0–10':m.tipo==='daniels'?'Escala 0–5':[num(m.min)!==null&&num(m.max)!==null?`${m.min}–${m.max}`:'',m.unidad].filter(Boolean).join(' ')||'Número';
const fmtV=(m,v)=>v==null?'—':r1(v)+(m.unidad?' '+m.unidad:'');
const fromCat=(c,det)=>({catId:c.id,nombre:det?c.nombre+' · '+det:c.nombre,detalle:det||'',unidad:c.unidad||'',min:c.min??'',max:c.max??'',mejor:c.mejor||'alto',tipo:c.tipo||'numero'});
function sugeridasMed(p){
  const words=(p.patologia||'').toLowerCase().split(/[^a-záéíóúñü]+/).filter(w=>w.length>3);
  if(!words.length)return [];
  const cnt={};
  list(S.pacientes).forEach(o=>{if(o.id===p.id||!o.medidas)return;const op=(o.patologia||'').toLowerCase();if(!words.some(w=>op.includes(w)))return;
    o.medidas.forEach(m=>{const k=m.catId+'|'+(m.detalle||'');(cnt[k]=cnt[k]||{m,n:0}).n++})});
  return Object.values(cnt).sort((a,b)=>b.n-a.n).slice(0,8).map(x=>x.m);
}
function serie(p,m){
  const out=[];const b=num(p.medidasBase?.[m.mid]);if(b!==null)out.push({lab:'Val.',v:b});
  sesionesDe(p.id).forEach((s,i)=>{const v=num(s.medidas?.[m.mid]);if(v!==null)out.push({lab:'S'+(i+1),v})});
  return out;
}
function cambio(m,a,b){const d=b-a;const lo=num(m.min),hi=num(m.max);const rango=lo!==null&&hi!==null?hi-lo:0;
  return {d,igual:d===0,mejora:m.mejor==='bajo'?d<0:d>0,pct:rango>0?Math.round(Math.abs(d)/rango*100):(a?Math.round(Math.abs(d)/Math.abs(a)*100):null)}}
function spark(m,pts){
  if(pts.length<2)return '';
  const vs=pts.map(x=>x.v);let lo=num(m.min)??Math.min(...vs),hi=num(m.max)??Math.max(...vs);if(m.tipo==='eva'){lo=0;hi=10}if(m.tipo==='daniels'){lo=0;hi=5}if(hi===lo)hi=lo+1;
  const w=110,h=36,x=i=>4+(w-8)*i/(pts.length-1),y=v=>4+(h-8)*(1-(v-lo)/(hi-lo));
  const d=pts.map((pt,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(pt.v).toFixed(1)).join(' ');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${d} L${x(pts.length-1).toFixed(1)} ${h} L${x(0)} ${h}Z" fill="var(--accent-soft)"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/><circle cx="${x(pts.length-1)}" cy="${y(pts[pts.length-1].v)}" r="3.5" fill="var(--accent)"/></svg>`;
}
function evolucion(p){
  return `<div class="list">${p.medidas.map(m=>{const s=serie(p,m);const a=s[0]?.v,b=s[s.length-1]?.v;const c=s.length>1?cambio(m,a,b):null;
   return `<div class="item" style="flex-wrap:wrap"><div class="grow" style="min-width:150px"><div class="name" style="white-space:normal">${esc(m.nombre)}</div>
    <div class="small muted">${s.length?`${fmtV(m,a)} → ${fmtV(m,b)}`:'Sin datos aún'} · ${m.mejor==='bajo'?'mejora si baja':'mejora si sube'}</div></div>
    ${spark(m,s)}${c?`<span class="pill ${c.igual?'done':c.mejora?'mint':'bad'}">${c.igual?'Igual':(c.mejora?'Mejoró ':'Empeoró ')+(c.d>0?'+':'')+r1(c.d)+(m.unidad?' '+m.unidad:'')}</span>`:''}</div>`}).join('')}</div>`;
}
const EVA_COL=v=>v<=3?'var(--ok)':v<=6?'var(--warn)':'var(--bad)';
function escala(attr,key,tipo,val){
  if(tipo==='eva')return `<div class="eva" ${attr}="${key}">${[...Array(11)].map((_,i)=>`<button type="button" data-act="pick" data-v="${i}" class="${String(val)===String(i)?'on':''}" style="${String(val)===String(i)?'background:'+EVA_COL(i):''}">${i}</button>`).join('')}</div><div class="eva-legend"><span>0</span><span>10</span></div>`;
  return `<div class="scale5" ${attr}="${key}">${[0,1,2,3,4,5].map(i=>`<button type="button" data-act="pick" data-v="${i}" class="${String(val)===String(i)?'on':''}">${i}</button>`).join('')}</div>`;
}
function medRow(m,val,{quitar=false,hint=''}={}){
  const inp=m.tipo==='eva'||m.tipo==='daniels'?escala('data-m',m.mid,m.tipo,val)
   :`<div class="row" style="flex-wrap:nowrap"><input id="m_${m.mid}" data-m="${m.mid}" inputmode="decimal" value="${esc(val??'')}" placeholder="${num(m.min)!==null&&num(m.max)!==null?esc(m.min+'–'+m.max):''}" style="max-width:170px"><span class="muted">${esc(m.unidad||'')}</span></div>`;
  return `<div class="qrow" data-mrow="${m.mid}"><div class="row between" style="flex-wrap:nowrap"><label for="m_${m.mid}" style="margin:0">${esc(m.nombre)} <span class="small muted" style="font-weight:600">(${m.mejor==='bajo'?'mejora si baja':'mejora si sube'})</span></label>
   ${quitar?`<button type="button" class="ghost danger" data-act="quitarMed" data-mid="${m.mid}">Quitar</button>`:''}</div>${inp}${hint?`<div class="small muted" style="margin-top:4px">${hint}</div>`:''}</div>`;
}

function medSeccion(p,{base}){

  else if(q.tipo==='sino'||q.tipo==='opciones'){const op=q.tipo==='sino'?['Sí','No']:(q.opciones||'').split(',').map(s=>s.trim()).filter(Boolean);
    inp=`<div class="opts" data-q="${q.id}">${op.map(o=>`<button type="button" data-act="pick" data-v="${esc(o)}" class="${val===o?'on':''}">${esc(o)}</button>`).join('')}</div>`}
  else if(q.tipo==='larga') inp=`<textarea id="${id}" data-q="${q.id}">${esc(val)}</textarea>${sugeridas(q)}`;
  else inp=`<input id="${id}" data-q="${q.id}" ${q.tipo==='numero'?'inputmode="decimal"':''} list="l_${q.id}" value="${esc(val)}"><datalist id="l_${q.id}">${aprendidas(q.id).map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`;

function sugeridas(q){const a=aprendidas(q.id).slice(0,8);if(!a.length)return '';
  return `<div class="chips" style="margin-top:6px">${a.map(x=>`<button type="button" class="chip" data-act="usar" data-q="${q.id}" data-v="${esc(x)}">${esc(x.length>40?x.slice(0,40)+'…':x)}</button>`).join('')}</div>`}
function leer(form){
  const r={};

function quitBox(qs){return qs.length?`<details class="card"><summary>Preguntas quitadas en este paciente (${qs.length})</summary><div class="chips" style="margin-top:10px">${qs.map(q=>`<button type="button" class="chip" data-act="volverQ" data-q="${q.id}">+ ${esc(q.texto)}</button>`).join('')}</div></details>`:''}
function extraRow(x){x=x||{};const k=uid('e');return `<div class="qrow" data-extra="${k}"><div class="row" style="flex-wrap:nowrap"><input aria-label="Nombre del dato" data-ex="label" value="${esc(x.label)}" placeholder="Ej: Hallazgos de la marcha" style="font-weight:800"><button type="button" class="ghost danger" data-act="quitarExtra" data-k="${k}" aria-label="Quitar dato">✕</button></div>

// ---- Excel y correo ----
const XMIME='application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
function hojaB64(data,titulo,cols,moneyCols){
  const ws=XLSX.utils.aoa_to_sheet(data);
  ws['!cols']=cols.map(w=>({wch:w}));
  for(let i=1;i<data.length;i++)moneyCols.forEach(L=>{const ref=L+(i+1);if(ws[ref]&&typeof ws[ref].v==='number')ws[ref].z='"$"#,##0'});
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,titulo.slice(0,30));
  return XLSX.write(wb,{type:'base64',bookType:'xlsx'});
}
function excelB64(rows,titulo){
  const data=[['Nombre del paciente','Entidad','Fecha de atención','Hora','Cédula','Modalidad','Profesional','Costo']].concat(rows.map(r=>[r.nombre,r.entidad,r.fecha,r.hora,r.cedula,r.modalidad,r.profesional,Number(r.costo)||0]));
  if(rows.length>1)data.push(['TOTAL','','','','','','',rows.reduce((a,r)=>a+(Number(r.costo)||0),0)]);
  return hojaB64(data,titulo,[30,18,14,10,14,12,20,12],['H']);
}
const filaDe=s=>{const p=S.pacientes[s.pacienteId]||{};return {nombre:p.nombre,entidad:p.entidad||'Particular',fecha:fmtCorto(s.fecha),hora:fmtHora(s.hora),cedula:p.cedula,modalidad:MOD[s.modalidad]||'',profesional:pro(proDe(p)).nombre,costo:s.costo}};
function gastroB64(ps){
  const val=cfg().costoGastro||55000;
  const data=[['Paciente','Cédula','WhatsApp','Correo','Procedimiento','Pre fecha','Pre hora','Pre modalidad','Pre estado','Post fecha','Post hora','Post modalidad','Post estado','Estado','Valor','Cobrado']];
  ps.forEach(p=>{const e=estadoGastro(p);const est=c=>!c?'Por agendar':c.estado==='hecha'?'Realizada':c.estado==='cancelada'?'No asistió':'Agendada';
    data.push([p.nombre,p.cedula||'',p.telefono||'',p.correo||'',p.patologia||'',fmtCorto(e.pre?.fecha),fmtHora(e.pre?.hora),MOD[e.pre?.modalidad]||'',est(e.pre),fmtCorto(e.post?.fecha),fmtHora(e.post?.hora),MOD[e.post?.modalidad]||'',est(e.post),e.txt,val,p.cobrado?'Sí':'No'])});
  const conPre=ps.filter(preHecho);
  data.push([]);data.push(['Con pre realizado',conPre.length,'','','','','','','','','','','','Por cobrar',conPre.filter(p=>!p.cobrado).length*val,'']);
  return hojaB64(data,'Gastro Quirúrgica',[28,13,13,24,20,11,10,12,11,11,10,12,11,22,11,9],['O']);
}
async function enviarCorreo({to,subject,body,htmlBody,attach}){
  to=to||cfg().correo; if(!to)throw new Error('sin_correo');
  if(!mcp)mcp=await window.claude?.use('mcp'); if(!mcp)throw new Error('sin_gmail');
  const input={to:[to],subject};
  const cc=pro('diana').correo; if(cc&&cc.toLowerCase()!==to.toLowerCase())input.cc=[cc]; // todo llega también a Diana
  if(body)input.body=body; if(htmlBody)input.htmlBody=htmlBody;
  if(attach)input.attachments=[attach];
  await mcp.callTool('Gmail','send_message',input);
}
const errCorreo=e=>e.message==='sin_correo'?'Falta el correo de destino.':(e.code==='server_not_connected'||e.message==='sin_gmail')?'Conecta Gmail en claude.ai para enviar correos.':'No se pudo enviar el correo.';
async function bajar(filename,b64,mime){
  if(!downloads)downloads=await window.claude?.use('downloads');
  if(!downloads){toast('Descargar no está disponible aquí.');return}
  const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
  try{await downloads.save({filename,data:new Blob([bin],{type:mime})})}catch(e){}
}
async function enviarExcelSesion(s){
  const p=S.pacientes[s.pacienteId]; const fn=`Atencion_${(p.nombre||'paciente').replace(/\s+/g,'_')}_${s.fecha}.xlsx`;
  const b64=excelB64([filaDe(s)],'Atención');
  try{await enviarCorreo({subject:`Atención fisioterapia · ${p.nombre} · ${fmtCorto(s.fecha)} ${fmtHora(s.hora)}`,
     body:`Paciente: ${p.nombre}\nC.C.: ${p.cedula||'—'}\nEntidad: ${p.entidad||'—'}\nFecha: ${fmtFecha(s.fecha)} ${fmtHora(s.hora)}\nModalidad: ${MOD[s.modalidad]||'—'}\nProfesional: ${pro(proDe(p)).nombre}\nCosto: ${money(s.costo)}\n\nExcel adjunto.`,
     attach:{content:b64,filename:fn,mimeType:XMIME}});

// ---- Documentos con membrete ----
function datosInforme(p){
  const ss=sesionesDe(p.id), qv=preguntasPara('valoracion',p), qsS=preguntasPara('sesion',p);
  const meds=(p.medidas||[]).map(m=>{const s=serie(p,m);const a=s[0]?.v,b=s[s.length-1]?.v;return {m,s,a,b,c:s.length>1?cambio(m,a,b):null}});
  const hizo={};qsS.filter(q=>q.tipo==='texto'||q.tipo==='larga').forEach(q=>{const u=new Set();ss.forEach(s=>{const v=s.respuestas?.[q.id];if(v)u.add(v)});if(u.size)hizo[q.texto]=[...u]});
  const notas=citasDe(p.id).filter(c=>c.nota&&c.estado!=='cancelada').map(c=>({fecha:c.fecha,nota:c.nota,hecha:c.estado==='hecha'}));
  return {ss,qv,meds,hizo,notas};
}

// ===== Envío sin Claude: hoja de compartir del celular =====
async function compartirArchivo(b64,filename,mime,texto){
  const blob=new Blob([Uint8Array.from(atob(b64),c=>c.charCodeAt(0))],{type:mime});
  try{const file=new File([blob],filename,{type:mime});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:filename,text:texto||''});return}}
  catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},3000);
  toast('Archivo descargado. Adjúntalo en WhatsApp o en el correo.',3800);
}
async function enviarCorreo({subject,body,attach}){
  if(attach)return compartirArchivo(attach.content,attach.filename,attach.mimeType,subject);
  if(navigator.share){try{await navigator.share({title:subject,text:body||''})}catch(e){}}
}
async function enviarExcelSesion(s){await patch('sesiones',s.id,{excelEnviado:null})}
async function enviarPDF(p,kind){
  try{const b64=pdfB64(p,kind);const pr=pro(proDe(p));
    await compartirArchivo(b64,pdfNombre(p,kind),'application/pdf',`Hola ${p.nombre.split(' ')[0]}, te comparto ${kind==='valoracion'?'tu valoración fisioterapéutica':'tu informe de avances'}. ${pr.nombre}, ${pr.titulo}.`);
    await patch('pacientes',p.id,{[kind==='valoracion'?'valPdfEnviado':'infPdfEnviado']:today()});
  }catch(e){toast('No se pudo crear el PDF. Revisa tu conexión a internet e inténtalo de nuevo.',4000)}
}
